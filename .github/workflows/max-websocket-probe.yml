name: Diagnose MAX WebSocket anonymous INIT (no SMS, no QR)
on:
  push:
    branches: [main]
    paths:
      - 'tests/MaxDesktop.WebSocket.Probe/**'
      - '.github/workflows/max-websocket-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-websocket-init:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check only WebSocket TLS and anonymous INIT
        run: dotnet run --project tests/MaxDesktop.WebSocket.Probe/MaxDesktop.WebSocket.Probe.csproj -c Release
      - name: Compare Windows Schannel HTTPS against the exact user endpoint
        shell: pwsh
        run: |
          # Exact target and method from the independent user's Windows test.
          # Discard HTTP response headers; do not log cookies or tokens.
          $target = 'https://ws-api.oneme.ru/websocket'
          $httpStatus = & curl.exe --silent --show-error -I --output NUL --write-out '%{http_code}' --max-time 15 $target
          $curlExit = $LASTEXITCODE
          Write-Host "RUNNER_CURL_EXIT_CODE=$curlExit"
          Write-Host "RUNNER_CURL_HTTP_STATUS=$httpStatus"
          if ($curlExit -ne 0) {
            throw "Windows curl.exe failed; compare the exit code with the user's independent Windows result."
          }
          if ($httpStatus -notmatch '^[1-5][0-9]{2}) {
            throw "No valid HTTP response code was returned after the TLS handshake."
          }
