name: Diagnose MAX alternative protocol endpoints
on:
  push:
    branches: [main]
    paths:
      - 'tests/MaxDesktop.EndpointProbe/**'
      - 'src/MaxDesktop.Protocol/NativeMaxTransport.cs'
      - 'src/MaxDesktop.Protocol/PhysicalMaxWebSocketChannel.cs'
      - 'src/MaxDesktop.Protocol/HybridMaxTransport.cs'
      - '.github/workflows/max-endpoint-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoints:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test TLS and anonymous session init per endpoint
        run: dotnet run --project tests/MaxDesktop.EndpointProbe/MaxDesktop.EndpointProbe.csproj -c Release
      - name: Verify native Android physical anonymous SESSION_INIT
        shell: pwsh
        run: |
          dotnet run --project tests/MaxDesktop.EndpointProbe/MaxDesktop.EndpointProbe.csproj -c Release -- --physical --require-success
          if ($LASTEXITCODE -ne 0) { throw 'Native Android physical SESSION_INIT failed' }
