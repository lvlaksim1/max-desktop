name: MAX Desktop Windows build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Bundle pinned VK CAPTCHA SDK and test completion callback
        shell: pwsh
        run: |
          Push-Location tools/captcha
          try {
            npm install --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned VK CAPTCHA SDK build dependencies' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'VK CAPTCHA SDK bundling failed' }
            npm run test
            if ($LASTEXITCODE -ne 0) { throw 'CAPTCHA callback verification failed' }
          }
          finally { Pop-Location }
      - name: Verify mini-app JS bridge behavior in isolated synthetic documents
        run: node --test tests/MaxDesktop.MiniAppBridge.Smoke/bridge.test.cjs
      - name: Build WPF app
        run: dotnet build src/MaxDesktop.App/MaxDesktop.App.csproj -c Release
      - name: Build update agent
        run: dotnet build src/MaxDesktop.UpdateAgent/MaxDesktop.UpdateAgent.csproj -c Release
      - name: Verify login dialog Close control preserves parent window
        run: dotnet run --project tests/MaxDesktop.LoginWindow.Smoke/MaxDesktop.LoginWindow.Smoke.csproj -c Release
      - name: Verify fail-closed transport
        run: dotnet run --project tests/MaxDesktop.Protocol.Smoke/MaxDesktop.Protocol.Smoke.csproj -c Release
      - name: Verify WebSocket SMS protocol and transport selection (offline)
        run: dotnet run --project tests/MaxDesktop.WebSocket.Smoke/MaxDesktop.WebSocket.Smoke.csproj -c Release
      - name: Verify installer digest and file-handle closure on Windows
        run: dotnet run --project tests/MaxDesktop.Update.Smoke/MaxDesktop.Update.Smoke.csproj -c Release
